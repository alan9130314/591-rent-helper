<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>591 租屋筆記</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="eyebrow">自己的找房清單</span><h1>591 租屋筆記<span class="dot">.</span></h1><p>記下看過的房子，留時間給下一間。</p></header>
<main>
<form id="add-form">
<label for="url">物件 ID 或網址</label><input id="url" type="text" placeholder="21964749 或 https://rent.591.com.tw/21964749" required autocomplete="off">
<label for="note">備註 <span class="muted">選填</span></label><input id="note" maxlength="120" placeholder="例如：近捷運，但採光不足">
<div class="form-row"><div><label for="status">物件狀態</label><select id="status"><option value="seen">已看過</option><option value="rejected">不考慮</option><option value="interested">有興趣</option></select></div><button type="submit" id="save">加入紀錄</button></div>
<button type="button" id="add-current" hidden>加入目前物件</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<section class="page-filter"><label for="page-filter">591 列表顯示</label><select id="page-filter"></select><small>套用至目前頁面已載入的物件，包含精選推薦。</small></section>
<section class="keyword-filter"><h2>標題關鍵字隱藏</h2><form id="keyword-form"><label class="keyword-toggle"><input type="checkbox" id="keyword-enabled">啟用關鍵字隱藏</label><label for="keyword-words">隱藏含以下關鍵字的標題</label><textarea id="keyword-words" rows="3" placeholder="每行一個關鍵字"></textarea><small>每行一個，也可用逗號分隔。任一關鍵字命中就隱藏；留空則不隱藏。</small><button type="submit" id="keyword-save">儲存關鍵字設定</button><p id="keyword-message" role="status" aria-live="polite"></p></form></section><section><div class="list-heading"><h2>我的紀錄 <span id="count">0</span></h2><select id="record-filter" aria-label="篩選我的紀錄"><option value="all">所有狀態</option><option value="seen">已看過</option><option value="rejected">不考慮</option><option value="interested">有興趣</option></select></div><input id="search" type="search" placeholder="搜尋標題、編號或備註" aria-label="搜尋紀錄"><div id="records"></div></section>
<section class="backup"><h2>備份與移轉</h2><p>匯出全部紀錄，或從 JSON 備份檔匯入。</p><label for="import-mode">遇到相同物件</label><select id="import-mode"><option value="keep">保留本機紀錄</option><option value="overwrite">以匯入紀錄覆蓋</option></select><div class="backup-actions"><button type="button" id="export-records">匯出紀錄</button><button type="button" id="import-records">匯入紀錄</button></div><input id="import-file" type="file" accept=".json,application/json" hidden><p id="backup-message" role="status" aria-live="polite"></p></section></main><footer>本機儲存 · 不會自動記錄瀏覽 · 非 591 官方工具</footer>
<script src="shared.js"></script><script src="popup.js"></script>
</body></html>
